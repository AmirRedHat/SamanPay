<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تست درگاه بانک سامان</title>

  <!-- Better Persian font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Vazirmatn', Tahoma, sans-serif;
      background: linear-gradient(135deg, #f0f4ff 0%, #e8f0fe 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #1e293b;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 36px 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 40px rgba(37, 99, 235, 0.12);
      border: 1px solid rgba(37, 99, 235, 0.08);
    }

    .logo {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      color: white;
      font-size: 24px;
      font-weight: 700;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      font-size: 14px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 13.5px;
      font-weight: 500;
      color: #334155;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 13px 15px;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      margin-bottom: 18px;
      transition: all 0.2s ease;
      background: #f8fafc;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    button {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 6px;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .error {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      background: #fef2f2;
      color: #dc2626;
      border-radius: 10px;
      font-size: 13.5px;
      border: 1px solid #fecaca;
      text-align: center;
    }

    .loading-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.95);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .loading-overlay.active {
      display: flex;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid #2563eb;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .note {
      margin-top: 24px;
      padding: 14px 16px;
      background: #f1f5f9;
      border-radius: 12px;
      font-size: 13px;
      color: #475569;
      line-height: 1.7;
    }

    .note strong {
      color: #1e293b;
    }

    .debug-info {
      margin-top: 16px;
      padding: 10px;
      background: #1e293b;
      color: #a5f3fc;
      border-radius: 8px;
      font-size: 12px;
      font-family: monospace;
      display: none;
      max-height: 200px;
      overflow: auto;
      white-space: pre-wrap;
      text-align: left;
      direction: ltr;
    }

    .success-message {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      background: #f0fdf4;
      color: #16a34a;
      border-radius: 10px;
      font-size: 13.5px;
      border: 1px solid #bbf7d0;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">س</div>
    <h1>تست درگاه بانک سامان</h1>
    <p class="subtitle">پرداخت آزمایشی با سرویس FastAPI</p>

    <form id="paymentForm">
      <label for="amount">مبلغ (ریال)</label>
      <input type="number" id="amount" value="10000" min="1000" required>

      <label for="resNum">شماره سفارش (ResNum)</label>
      <input type="text" id="resNum" placeholder="اختیاری - در صورت خالی بودن خودکار ساخته می‌شود">

      <button type="submit" id="payBtn">پرداخت با بانک سامان</button>
    </form>

    <div class="error" id="errorBox"></div>
    <div class="success-message" id="successBox"></div>
    <div class="debug-info" id="debugInfo"></div>

    <div class="note">
      • مبلغ به <strong>ریال</strong> وارد شود.<br>
      • پس از کلیک به صفحه امن درگاه سامان هدایت می‌شوید.<br>
      • پس از پرداخت به آدرس <code>/callback</code> بازمی‌گردید.
    </div>
  </div>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <h3>در حال انتقال به درگاه پرداخت...</h3>
    <p style="color: #64748b; margin-top: 8px;">لطفاً چند لحظه صبر کنید</p>
  </div>

  <script>
    const form = document.getElementById("paymentForm");
    const payBtn = document.getElementById("payBtn");
    const errorBox = document.getElementById("errorBox");
    const successBox = document.getElementById("successBox");
    const debugInfo = document.getElementById("debugInfo");
    const loadingOverlay = document.getElementById("loadingOverlay");

    // Get the base URL for redirects
    const getBaseUrl = () => {
      return window.location.origin;
    };

    // Check if we're in development mode
    const isDevelopment = window.location.hostname === 'localhost' || 
                          window.location.hostname === '127.0.0.1' ||
                          window.location.hostname === '192.168.1.222';

    // Check for callback parameters on page load
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const refNum = urlParams.get('RefNum');
      const resNum = urlParams.get('ResNum');
      const state = urlParams.get('State');
      
      if (refNum) {
        // We're returning from the bank
        handleCallback(refNum, resNum, state);
      }
    });

    async function handleCallback(refNum, resNum, state) {
      try {
        const response = await fetch(`/callback?RefNum=${refNum}&ResNum=${resNum}&State=${state}`);
        const result = await response.json();
        
        if (result.success) {
          successBox.textContent = '✅ پرداخت با موفقیت انجام شد!';
          successBox.style.display = 'block';
          errorBox.style.display = 'none';
          
          if (isDevelopment) {
            debugInfo.textContent = JSON.stringify(result.data, null, 2);
            debugInfo.style.display = 'block';
          }
        } else {
          errorBox.textContent = `❌ خطا در پرداخت: ${result.error}`;
          errorBox.style.display = 'block';
          successBox.style.display = 'none';
        }
      } catch (error) {
        errorBox.textContent = `❌ خطا در پردازش بازگشت: ${error.message}`;
        errorBox.style.display = 'block';
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.style.display = "none";
      successBox.style.display = "none";
      debugInfo.style.display = "none";
      payBtn.disabled = true;
      payBtn.textContent = "در حال انتقال به درگاه...";

      const amount = Number(document.getElementById("amount").value);
      const resNum = document.getElementById("resNum").value.trim() || null;

      // Validate amount
      if (!amount || amount <= 0) {
        errorBox.textContent = "لطفاً مبلغ معتبر وارد کنید";
        errorBox.style.display = "block";
        payBtn.disabled = false;
        payBtn.textContent = "پرداخت با بانک سامان";
        return;
      }

      try {
        // Step 1: Get token from your backend
        const response = await fetch("/saman/pay", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            amount: amount,
            res_num: resNum
          })
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "خطا در ایجاد پرداخت");
        }

        // Show debug info if in development
        if (isDevelopment) {
          debugInfo.textContent = JSON.stringify(result, null, 2);
          debugInfo.style.display = 'block';
        }

        if (result.success && result.token) {
          // Step 2: Redirect to Saman Bank payment page with token
          // Using SendToken endpoint as per documentation
          const bankUrl = `https://sep.shaparak.ir/OnlinePG/SendToken?token=${result.token}`;
          
          console.log('Redirecting to bank:', bankUrl);
          console.log('Token:', result.token);
          console.log('ResNum:', result.res_num);
          
          // Show loading overlay
          loadingOverlay.classList.add('active');
          
          // Redirect after a small delay to show loading state
          setTimeout(() => {
            window.location.href = bankUrl;
          }, 500);
          
        } else {
          throw new Error(result.error || 'توکن دریافت نشد');
        }

      } catch (err) {
        console.error('Error:', err);
        errorBox.textContent = err.message || "خطایی رخ داد. لطفا دوباره تلاش کنید.";
        errorBox.style.display = "block";
        payBtn.disabled = false;
        payBtn.textContent = "پرداخت با بانک سامان";
        loadingOverlay.classList.remove('active');
      }
    });
  </script>
</body>
</html>
